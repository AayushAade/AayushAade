<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 195" width="450" height="195" fill="none">
  <defs>
    <linearGradient id="cardGradLangs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #7aa2f7; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #c0caf5; }
    .lang-pct { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #7dcfff; }
  </style>

  <rect width="450" height="195" rx="10" fill="url(#cardGradLangs)" stroke="#30363d" stroke-width="1" />

  <!-- Title -->
  <g transform="translate(25, 32)">
    <circle cx="6" cy="6" r="4" fill="#7aa2f7" />
    <text x="18" y="10" class="header">Most Used Languages</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 62)">
    <rect width="390" height="8" rx="4" fill="#21262d" />
    <rect x="0.0" y="0" width="210.0" height="8" fill="#3572A5" rx="2" />
    <rect x="210.0" y="0" width="90.0" height="8" fill="#f1e05a" rx="2" />
    <rect x="300.0" y="0" width="60.0" height="8" fill="#e34c26" rx="2" />
    <rect x="360.0" y="0" width="30.0" height="8" fill="#f34b7d" rx="2" />
  </g>

  <!-- Language Legend -->
  <g transform="translate(25, 96)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" />
      <text x="18" y="10" class="lang-name">Python</text>
      <text x="175" y="10" class="lang-pct" text-anchor="end">53.8%</text>
    </g>
    <g transform="translate(200, 0)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a" />
      <text x="18" y="10" class="lang-name">JavaScript</text>
      <text x="175" y="10" class="lang-pct" text-anchor="end">23.1%</text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="5" fill="#e34c26" />
      <text x="18" y="10" class="lang-name">HTML</text>
      <text x="175" y="10" class="lang-pct" text-anchor="end">15.4%</text>
    </g>
    <g transform="translate(200, 26)">
      <circle cx="6" cy="6" r="5" fill="#f34b7d" />
      <text x="18" y="10" class="lang-name">C++</text>
      <text x="175" y="10" class="lang-pct" text-anchor="end">7.7%</text>
    </g>
  </g>
</svg>