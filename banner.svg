<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="14" fill="url(#indigoGlow)" />
  <rect width="900" height="240" rx="14" fill="url(#purpleGlow)" />
  <rect width="900" height="240" rx="14" fill="url(#cyanGlow)" />
  <rect x="1" y="1" width="898" height="238" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Neural Network / Circuit Graph Nodes & Lines -->
  <g opacity="0.85" transform="translate(600, 20)">
    <!-- Circuit lines -->
    <line x1="40" y1="40" x2="90" y2="80" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="90" y1="80" x2="170" y2="50" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="170" y1="50" x2="230" y2="90" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5" />
    <line x1="90" y1="80" x2="120" y2="140" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <line x1="120" y1="140" x2="200" y2="150" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <line x1="170" y1="50" x2="200" y2="150" stroke="#a855f7" stroke-width="1.2" opacity="0.5" />
    <line x1="200" y1="150" x2="250" y2="170" stroke="#a855f7" stroke-width="1.2" opacity="0.5" />
    <line x1="20" y1="110" x2="90" y2="80" stroke="#4f46e5" stroke-width="1.2" opacity="0.4" />
    <line x1="120" y1="140" x2="70" y2="180" stroke="#4f46e5" stroke-width="1.2" opacity="0.4" />
    <line x1="120" y1="140" x2="160" y2="190" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="160" y1="190" x2="250" y2="170" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Connected Circles / Nodes -->
    <circle cx="40" cy="40" r="3.5" fill="#818cf8" />
    <circle cx="90" cy="80" r="5" fill="#38bdf8" />
    <circle cx="90" cy="80" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <circle cx="170" cy="50" r="4.5" fill="#c084fc" />
    <circle cx="230" cy="90" r="3.5" fill="#818cf8" />
    <circle cx="120" cy="140" r="5.5" fill="#6366f1" />
    <circle cx="120" cy="140" r="11" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4" />
    <circle cx="200" cy="150" r="4" fill="#38bdf8" />
    <circle cx="250" cy="170" r="3" fill="#a855f7" />
    <circle cx="20" cy="110" r="3" fill="#60a5fa" />
    <circle cx="70" cy="180" r="4" fill="#818cf8" />
    <circle cx="160" cy="190" r="3.5" fill="#06b6d4" />
  </g>

  <!-- Left Status Pill -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#22c55e" />
    <circle cx="12" cy="12" r="7" fill="#22c55e" fill-opacity="0.25" />
    <text x="25" y="16" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a5b4fc" font-weight="bold" letter-spacing="0.5">AI &amp; SYSTEMS</text>
  </g>

  <!-- Main Title -->
  <text x="52" y="106" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="url(#titleGrad)">
    Hi, I'm Aayush Aade
  </text>

  <!-- Subtitle -->
  <text x="52" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="url(#subGrad)">
    AI &amp; Data Science Student | Aspiring AI Engineer &amp; Systems Builder
  </text>

  <!-- Tagline Capsules -->
  <g transform="translate(52, 164)">
    <!-- Capsule 1: Computer Vision -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="30" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="15" r="3" fill="#38bdf8" />
      <text x="26" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#cbd5e1" font-weight="500">Computer Vision</text>
    </g>

    <!-- Capsule 2: Machine Learning -->
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="150" height="30" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="15" r="3" fill="#818cf8" />
      <text x="26" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#cbd5e1" font-weight="500">Machine Learning</text>
    </g>

    <!-- Capsule 3: Real-Time AI Systems -->
    <g transform="translate(315, 0)">
      <rect x="0" y="0" width="175" height="30" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="15" r="3" fill="#c084fc" />
      <text x="26" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#cbd5e1" font-weight="500">Real-Time AI Systems</text>
    </g>
  </g>
</svg>
